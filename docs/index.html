const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dbName='agentic-practice-access-v1';
const keyId='trainer-key:'+location.pathname;
const legacyName='agentic-practice-key:'+location.pathname;
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));const request=indexedDB.open(dbName,1);request.onupgradeneeded=()=>request.result.createObjectStore('keys');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
const keyStore={
 async read(){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction('keys','readonly');const request=tx.objectStore('keys').get(keyId);request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);tx.oncomplete=()=>db.close();});},
 async save(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(key,keyId);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});},
 async clear(){try{const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').delete(keyId);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}catch{}}
};
async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(payload.iv)},key,dec(payload.ct)));}
function show(html){
 const parsed=new DOMParser().parseFromString(html,'text/html');
 document.documentElement.innerHTML=parsed.documentElement.innerHTML;
 for(const old of [...document.querySelectorAll('script')]){const fresh=document.createElement('script');for(const a of old.attributes)fresh.setAttribute(a.name,a.value);fresh.textContent=old.textContent;old.replaceWith(fresh)}
 window.scrollTo(0,0);
}
async function openWithPassword(password){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(payload.salt),iterations:payload.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=await decrypt(key);
 await keyStore.save(key);
 show(html);
}
document.getElementById('gate-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('unlock');button.disabled=true;
 try{await openWithPassword(document.getElementById('password').value);}
 catch{document.getElementById('error').textContent=crypto.subtle?'Пароль не подошёл. Проверьте его на слайде.':'Откройте тренажёр по защищённой ссылке HTTPS.';document.getElementById('password').value='';button.disabled=false;}
});
(async()=>{try{localStorage.removeItem(legacyName);}catch{}try{const key=await keyStore.read();if(key){show(await decrypt(key));return;}}catch{await keyStore.clear();}document.body.classList.remove('checking');document.getElementById('password').focus();})();
</script></body></html>
